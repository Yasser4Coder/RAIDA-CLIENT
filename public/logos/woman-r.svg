<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <linearGradient id="girl" x1="20" y1="20" x2="100" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2A0B8"/>
      <stop offset="0.45" stop-color="#E891A8"/>
      <stop offset="1" stop-color="#D4789A"/>
    </linearGradient>
  </defs>
  <!-- Woman + R + growth arrow  girl colors -->
  <!-- Head -->
  <circle cx="32" cy="28" r="10" stroke="url(#girl)" stroke-width="5.5" fill="none"/>
  <!-- Left arm (curves down) -->
  <path d="M28 42 C18 48 14 58 16 72" stroke="url(#girl)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Body / dress left side -->
  <path d="M36 40 C34 52 28 68 24 86" stroke="url(#girl)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Dress right merges into R stem -->
  <path d="M38 42 C42 56 46 70 48 86" stroke="url(#girl)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Upward growth arrow -->
  <path d="M42 52 L72 22" stroke="url(#girl)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M58 20 L72 22 L68 36" stroke="url(#girl)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Letter R -->
  <path d="M48 86 V28 C48 28 48 18 62 18 C78 18 84 28 84 40 C84 52 76 58 64 58 L84 86"
    stroke="url(#girl)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
