  <rect width="100" height="100" rx="22" fill="#0A1328"/>
  <!-- Growth trail -->
  <path d="M24 78 C34 70 38 58 44 48 C50 38 56 30 72 22" stroke="#C9A55C" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- Head -->
  <circle cx="52" cy="34" r="11" fill="#E4A0B0"/>
  <circle cx="52" cy="34" r="11" stroke="#C9A55C" stroke-width="1.6" fill="none"/>
  <!-- Shoulders / torso  soft feminine silhouette -->
  <path d="M34 78 C36 58 42 50 52 50 C62 50 68 58 70 78" fill="#C9A55C"/>
  <!-- Inner torso highlight -->
  <path d="M42 78 C43 62 47 56 52 56 C57 56 61 62 62 78" fill="#0A1328" opacity="0.25"/>
  <!-- Opportunity node -->
  <circle cx="72" cy="22" r="4.5" fill="#FAF8F4"/>
</svg>
